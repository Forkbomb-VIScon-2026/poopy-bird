name: Android

# Builds the Android app's APKs (README "Android app") and keeps them as
# artifacts for a week. A workflow of its own, not a job in CI, so the web
# version's checks never wait for the app.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Capacitor 8 builds with Java 21; the runner has the Android SDK.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run fetch-model
      # Two APKs: the game as it ships, and one with the debug tooling (the
      # panel's "D" button, tuning). Same app id, so one replaces the other.
      - run: npm run build:debug
      - run: npx cap sync android
      - run: ./gradlew assembleDebug && mv app/build/outputs/apk/debug/app-debug.apk ../poopy-bird-debug-panel.apk
        working-directory: android
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug && mv app/build/outputs/apk/debug/app-debug.apk ../poopy-bird.apk
        working-directory: android
      # Keeps the release build working (android-release.yml signs it with the real key).
      - name: Release build, signed with the debug key
        run: ./gradlew assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE: app/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poopy-bird-apk
          path: poopy-bird.apk
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: poopy-bird-debug-panel-apk
          path: poopy-bird-debug-panel.apk
          retention-days: 7
