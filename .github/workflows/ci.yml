name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Includes the typecheck
      - run: npm run build
      # The debug variant must keep compiling too, but is never deployed
      - run: npm run build:debug

  # The Nix package, which is what poopybird.com serves. Fails when
  # npmDepsHash in nix/poopybird.nix is stale (README "Nix package and deployment").
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
